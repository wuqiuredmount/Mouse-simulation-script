# ================= 学习型规则（已积累） =================
# 引擎按【从上到下】顺序找第一条满足条件且冷却结束的规则执行。
# 所以优先级：开局 > 求助锦囊 > 放弃 > 事件? > 推进 > 右下角?

settings:
  scan_interval: 0.5       # 每轮检测间隔（秒，越小越快）
  match_threshold: 0.82    # 默认模板匹配阈值（兼顾图标颜色差异）


thresholds:               # 每模板匹配阈值（默认用 settings.match_threshold）
  sr_badge: 0.62          # 紫徽章图标有动画，需低阈值
  sr_cart_event2: 0.62
  sr_ring: 0.65
  sr_event_star: 0.65
  sr_event_star2: 0.65

rules:
  # ---- 开始一轮：点【商】 -> 等1秒 -> 点【派遣】----
  - id: start_round
    desc: "开始一轮：点 商 -> 等1秒 -> 点 派遣"
    when_visible: [sr_shang, sr_dispatch]
    action:
      - click: sr_shang
      - wait: 1.0
      - click: sr_dispatch
    cooldown: 4.0

  # ---- 有【求助锦囊】就点它（优先于放弃）----
  - id: click_help
    desc: "出现 求助锦囊 就点击"
    when_any: [sr_help]
    action:
      - click: sr_help
    cooldown: 3.0

  # ---- 丝绸交易：优先点 丝绸换礼（不能选放弃）----
  - id: click_silk_exchange
    desc: "丝绸交易：点 丝绸换礼（优先于放弃）"
    when_any: [sr_silk_exchange]
    action:
      - click: sr_silk_exchange
    cooldown: 3.0

  # ---- 出现【放弃】按钮就点它（如集市交易）----
  - id: click_giveup
    desc: "出现 放弃 按钮就点击"
    when_any: [sr_giveup]
    action:
      - click: sr_giveup
    cooldown: 3.0

  # ---- 马车上方出现【事件?】就点它（触发事件）----
  - id: click_cart_event
    desc: "马车上方的 事件图标 出现就点击"
    when_any: [sr_cart_event, sr_cart_event2, sr_badge]
    action:
      - click: sr_cart_event
      - click: sr_cart_event2
      - click: sr_badge
    cooldown: 3.0

  # ---- 马车上方出现【星形 !! 事件】就点它（事件的另一种图标）----
  - id: click_event_star
    desc: "马车上方的 星形!! 事件图标出现就点击"
    when_any: [sr_event_star, sr_event_star2]
    action:
      - click: sr_event_star
      - click: sr_event_star2
    cooldown: 3.0


  # ---- 马车上出现【红宝石戒指】就点它 ----
  - id: click_ring
    desc: "马车上出现红宝石戒指就点击"
    when_any: [sr_ring]
    action:
      - click: sr_ring
    cooldown: 3.0
  # ---- 事件对话中出现橙色【推进】图标就点它 ----
  - id: click_advance
    desc: "事件对话的橙色推进图标出现就点击"
    when_any: [sr_advance]
    action:
      - click: sr_advance
    cooldown: 2.0

  # ---- 当机立断(狼群)：选 A「所有人都点起火把」----
  - id: choose_wolf_A
    desc: "当机立断(狼群)事件：选 A"
    when_any: [sr_optA_wolf]
    action:
      - click: sr_optA_wolf
    cooldown: 3.0



  # ---- 偶遇牧民：点【探寻宝物】进入小游戏 ----
  - id: treasure_enter
    desc: "偶遇牧民：点 探寻宝物 进入限时小游戏"
    when_any: [sr_treasure_enter]
    action:
      - click: sr_treasure_enter
    cooldown: 3.0

  # ---- 探索宝物中：4秒内连点中央红宝石10下 ----
  - id: treasure_ruby
    desc: "探索宝物中：连点中央红宝石10下"
    when_any: [sr_exploring]
    action:
      - repeat_click:
          x: 1260
          y: 960
          count: 10
          interval: 0.3
    cooldown: 5.0

  # ---- 当机立断(沼泽)：选 C ----
  - id: choose_swamp_C
    desc: "当机立断(沼泽)事件：选 C"
    when_any: [sr_optC_swamp]
    action:
      - click: sr_optC_swamp
    cooldown: 3.0
  # ---- 礼品展示：点开始吧，等3秒让宝箱换位，再点右宝箱 ----
  - id: gift_start
    desc: "礼品展示：点开始吧 -> 等3秒 -> 点右宝箱"
    when_any: [sr_gift_start]
    action:
      - click: sr_gift_start
      - wait: 3.0
      - click_at: [1660, 1075]
    cooldown: 6.0

  # ---- 宝箱请选择：固定点右宝箱 ----
  - id: choose_right_chest
    desc: "请选择：固定点右宝箱"
    when_any: [sr_choose]
    action:
      - click_at: [1660, 1075]
    cooldown: 4.0
  # ---- 出现【收下贡品】就点它（使者进贡，白拿奖励）----
  - id: click_accept_gift
    desc: "出现 收下贡品 就点击"
    when_any: [sr_accept_gift]
    action:
      - click: sr_accept_gift
    cooldown: 3.0

  # ---- 结算界面出现【确定】就点它（丝绸之路一轮结束）----
  - id: click_settle_confirm
    desc: "结算界面出现 确定 按钮就点击"
    when_any: [sr_settle_confirm]
    action:
      - click: sr_settle_confirm
    cooldown: 3.0

  # ---- 注意：右下角【问号?】是常驻帮助按钮，已停用（会死循环点击）----
  # - id: click_question
  #   desc: "出现右下角问号?按钮就点击"
  #   when_any: [sr_question]
  #   action:
  #     - click: sr_question
  #   cooldown: 3.0
