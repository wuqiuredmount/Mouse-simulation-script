# ================= 选择事件知识库 =================
# 游戏中弹出的 A/B/C 选择事件。
# 脚本会 OCR 识别题干，匹配这里，点正确选项。
#
# 结构：
#   events:
#     - id: 事件编号
#       question_keywords: [关键词1, 关键词2]   # 题干包含这些词就匹配
#       answer: "A" | "B" | "C"                  # 正确选项
#       note: 备注（可选）

settings:
  match_threshold: 0.6      # 关键词匹配所需命中比例

# 选项按钮区域（相对丝绸之路弹窗，绝对屏幕坐标，用校准工具确定）
option_buttons:
  A: { x: 0, y: 0, w: 0, h: 0 }
  B: { x: 0, y: 0, w: 0, h: 0 }
  C: { x: 0, y: 0, w: 0, h: 0 }

events:
  - id: bandit_001
    question_keywords: ["山贼", "行军", "定夺"]
    answer: "A"
    note: "山贼事件-快速通过（待你确认正确答案）"

  # 继续往这里加事件…
