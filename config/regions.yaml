# ================= 屏幕区域定义 =================
# 坐标均为绝对像素，原点在屏幕左上角。
# 游戏分辨率变化后需重新校准（后续可加校准工具）。

regions:
  # 题干显示区域
  question: { x: 400, y: 200, w: 1120, h: 220 }

  # 四个选项按钮区域（id 对应选项序号）
  options:
    - { id: 0, x: 450, y: 480, w: 1020, h: 90 }
    - { id: 1, x: 450, y: 590, w: 1020, h: 90 }
    - { id: 2, x: 450, y: 700, w: 1020, h: 90 }
    - { id: 3, x: 450, y: 810, w: 1020, h: 90 }

# 触发区域：只有当该区域出现答题标志时才启动识别（可选，避免误触）
trigger:
  enabled: false
  region: { x: 1600, y: 100, w: 300, h: 120 }
  template: "data/assets/quiz_icon.png"   # 触发模板图，可留空
